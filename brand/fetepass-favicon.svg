<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="FetePass">
  <title>FetePass</title>
  <!--
    The small mark, for 32px and below.

    Two simplifications from the app icon, both of them about what survives a downscale:

    1. The slot is dropped. At 16px the tear notches are a third of a pixel and the
       perforation is sub-pixel, so they render as grey mush along the tear line rather
       than as a tear. The stub stays, because it is ~3px of accent at 16px and is the
       one piece of the mark that still reads at that size.

    2. The geometry is snapped to the pixel grid. The mark is 768 x 512 at (128, 256) in
       this 1024 viewBox, which at 16px is exactly 12 x 8 at (2, 4), at 24px exactly
       18 x 12 at (3, 6), and at 32px exactly 24 x 16 at (4, 8). The stub's 192 is
       exactly 3px at 16 and 6px at 32. The earlier 82%-of-width version landed the
       horizontal edges on half pixels and rasterised with a grey band across the top
       and bottom of the mark at 16px, which reads as a blurred icon rather than a
       small one.

    Aspect is 2:3 here against the app icon's 440:640, a 3% difference taken deliberately
    to buy that alignment.
  -->
  <rect width="1024" height="1024" fill="#04080A"/>
  <defs>
    <clipPath id="fp-body-sm">
      <rect x="128" y="256" width="768" height="512" rx="84"/>
    </clipPath>
  </defs>
  <g clip-path="url(#fp-body-sm)">
    <rect x="128" y="256" width="768" height="512" fill="#E8F1EE"/>
    <rect x="704" y="256" width="192" height="512" fill="#1FBF8F"/>
  </g>
</svg>
