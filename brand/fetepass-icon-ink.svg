<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="FetePass">
  <title>FetePass</title>
  <!-- Ink ground, full bleed: iOS squircle-masks and Android maskable-crops on top of this. -->
  <rect width="1024" height="1024" fill="#04080A"/>
  <!--
    The pass mark. Authored in a 640x440 local box and placed at 76% of the icon width,
    which is right for a `purpose: any` icon. The maskable variant is NOT a second drawing:
    the ground is a flat ink field, so scripts/brand-icons.mjs scales this whole icon to
    0.822 and pads with the same ink, which puts the mark at 62.5% — inside Android's
    guaranteed safe circle (80% of width). See the note in that script.
  -->
  <g transform="translate(123.2 244.4) scale(1.21875)">
    <defs>
      <clipPath id="fp-body">
        <rect x="0" y="0" width="640" height="440" rx="72"/>
      </clipPath>
    </defs>
    <g clip-path="url(#fp-body)">
      <rect x="0" y="0" width="640" height="440" fill="#E8F1EE"/>
      <rect x="470" y="0" width="170" height="440" fill="#1FBF8F"/>
    </g>
    <!-- The slot: two tear notches and the perforation between them. -->
    <circle cx="470" cy="0" r="40" fill="#04080A"/>
    <circle cx="470" cy="440" r="40" fill="#04080A"/>
    <!-- 7 dashes of 24 with 6 gaps of 20 = 288, centred on the 440 axis (y 76..364). -->
    <line x1="470" y1="76" x2="470" y2="364" stroke="#04080A" stroke-width="12"
          stroke-dasharray="24 20" stroke-linecap="butt"/>
  </g>
</svg>
